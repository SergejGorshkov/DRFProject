name: Django CI  # имя workflow
on: [ push, pull_request ]  # события, на которых будет запускаться workflow

# контейнер для задач, которые выполняются параллельно или последовательно
jobs:
  # Определение job с именем "lint", который выполняет проверку кода на соответствие стандартам PEP8
  lint:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest

    # Последовательность операций внутри job "lint"
    steps:
      # Шаг 1: Клонирование репозитория с исходным кодом
      - name: Check out code
        uses: actions/checkout@v4

      # Шаг 2: Установка Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4  # Устанавливает Python
        with:
          python-version: '3.12'  # Конкретная версия Python для использования

      # Шаг 3: Обновление pip до последней версии и установка линтера flake8
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Шаг 4: Запуск проверки кода в текущей директории с помощью flake8 на соответствие PEP8
      - name: Run flake8
        run: flake8 .

################################################################################################################

  # Определение job с именем "test", которая выполняет тестирование приложения
  test:
    runs-on: ubuntu-latest  # Указывает, что job будет запущен на последней версии Ubuntu
    needs: lint  # Зависимость: выполняется только если задача 'lint' успешна

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}
          POSTGRES_USER: ${{ secrets.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Ожидание PostgreSQL
          - name: Wait for PostgreSQL to be ready
            run: |
              for i in {1..30}; do
                if pg_isready -h localhost -p 5432 -U ${{ secrets.DATABASE_USER }} -d ${{ secrets.DATABASE_NAME }}; then
                  echo "PostgreSQL is ready!"
                  break
                fi
                echo "Waiting for PostgreSQL... attempt $i"
                sleep 2
              done

      - name: Create .env for tests
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=localhost" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

      - name: Run migrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
        run: python manage.py test
################################################################################################################
  # Определение job с именем "build", которая выполняет сборку и интеграцию Docker-образа
  build:
    # Указание ОС для запуска (последняя версия Ubuntu)
    runs-on: ubuntu-latest
    needs: test  # Зависимость: выполняется только если задача 'test' успешна

    # Последовательность операций внутри job "build"
    steps:
      # Шаг 1: Получение кода из репозитория
      - name: Check out code
        # Использование официального action для клонирования репозитория
        uses: actions/checkout@v4

      # Шаг 2: Авторизация в Docker Hub с использованием секретного токена
      - name: Log in to Docker Hub
        # Команда для входа в DockerHub, использующая секретный токен доступа и имя пользователя DockerHub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      # Шаг 3: Сборка Docker образа, используя тег из последнего коммита
      - name: Build Docker image
        # Команда сборки образа с тегом, содержащим: имя пользователя Docker Hub, имя приложения "myapp" и хэш коммита
        # для уникальной идентификации
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      # Шаг 4: Публикация собранного образа в Docker Hub
      - name: Push Docker image to Docker Hub
        # Команда отправки собранного образа в реестр Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

################################################################################################################

  # Задача деплоя (запускается только после успешной сборки Docker-образа)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/DRFProject

            # Создаем полный .env файл
            cat > .env << EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.SERVER_IP }},localhost,127.0.0.1
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_HOST=db
            DATABASE_PORT=5432
            CELERY_BROKER_URL=redis://redis:6379/1
            CELERY_RESULT_BACKEND=redis://redis:6379/2
            REDIS_URL=redis://redis:6379/0
            EMAIL_HOST=smtp.yandex.ru
            EMAIL_PORT=465
            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            EOF

            # Запускаем всю инфраструктуру через docker-compose
            sudo docker-compose down
            sudo docker-compose up -d

            # Ждем запуска БД и выполняем миграции
            sudo docker-compose exec -T web python manage.py migrate --noinput
            sudo docker-compose exec -T web python manage.py collectstatic --noinput
